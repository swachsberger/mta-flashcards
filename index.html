<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTA Mastery</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <button class="back hidden" id="backBtn">← Home</button>
    <h1><span class="tag">MTA / Mastery</span><span class="crumb" id="modeTitle"></span></h1>
  </div>

  <!-- HOME -->
  <div id="home">
    <div class="sub">Drills to help you master the NYC subway map — one station, one line at a time.</div>
    <div class="home-stats">
      <span>Mastery<b id="statMastery">0%</b></span>
      <span>Cards seen<b id="statSeen">0</b></span>
      <span>Accuracy<b id="statAcc">0%</b></span>
    </div>
    <div class="mode-grid" id="modeGrid"></div>
  </div>

  <!-- MODE VIEW -->
  <div id="view" class="hidden"></div>

</div>

<!-- data (classic scripts so the app also runs offline from file://) -->
<script src="data/stations.js"></script>
<script src="data/routes.js"></script>
<script src="data/meta.js"></script>
<!-- engine -->
<script src="js/stats.js"></script>
<script src="js/app.js"></script>
<!-- modes self-register -->
<script src="js/modes/flashcards.js"></script>
<script src="js/modes/linestops.js"></script>
<script>App.start();</script>
</body>
</html>
